name: Release

on:
  push:
    tags:
      - 'v*'

# One publish run per tag; a re-run of the same tag waits, and the publish
# script itself is idempotent (already-published versions are skipped).
concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish both crates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Run release-script tests
        shell: pwsh
        run: |
          ./scripts/test-check-versions.ps1
          ./scripts/test-crate-index.ps1

      - name: Verify version dependency and tag consistency
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/check-versions.ps1 -ExpectedTag $env:TAG_NAME

      - name: Pre-release build gate
        shell: pwsh
        run: cargo check --workspace --all-targets --all-features

      - name: Publish uiautomation_derive (first)
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crate.ps1 -Crate uiautomation_derive

      - name: Publish uiautomation (second)
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crate.ps1 -Crate uiautomation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
